# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mojobpf"
version = "0.2.0"
description = "Mojo-authored Linux eBPF programs compiled to standard BPF ELF"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0 WITH LLVM-exception" }
keywords = ["bpf", "ebpf", "mojo", "xdp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Operating System Kernels :: Linux",
    "Topic :: Software Development :: Compilers",
]
dependencies = []

[project.scripts]
mojobpf = "mojobpf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mojobpf = [
    "resources/sdk/mojobpf/*.mojo",
    "resources/adapter/*.py",
]

[tool.setuptools.data-files]
"share/mojobpf/schemas" = [
    "schemas/target.schema.json",
    "schemas/fixture.schema.json",
    "schemas/run-plan.schema.json",
    "schemas/result.schema.json",
    "schemas/cost.schema.json",
]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

# Build-hook table for tools/generate_adapter_resources.py (wired
# into the setuptools build_py/sdist commands by setup.py): the
# authoritative adapter sources and the packaged copies derived
# from them as a deterministic byte copy. The mirror tests pin
# the same file set from the harness side.
[tool.mojobpf.adapter_generation]
source_dir = "compiler"
target_dir = "src/mojobpf/resources/adapter"
files = [
    "adapter_service.py",
    "audit.py",
    "mojo_ir_adapter.py",
]
