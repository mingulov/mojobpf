# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# MojoBPF tag-triggered draft release.
#
# On tag push (v*.*.*): rebuilds wheel+sdist from the tag,
# verifies the extracted wheel contents against
# docs/checksums-<ver>.md, attests the artifacts, and opens a
# DRAFT GitHub release with wheel + sdist + checksums. Publish
# itself stays a human click after out-of-band verification
# (see RELEASING.md). Trust floor: the signed tag (verified
# with `git verify-tag`) plus this workflow's attestation.
#
# Supply chain: every Action pinned to a full commit SHA (the
# trailing comment names the major tag it resolves).
name: release-draft

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  draft:
    name: build, verify, and draft the release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: derive the version from the tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          test "$version" != "$tag" || { echo "tag is not v<ver>: $tag"; exit 2; }
          test -f "docs/checksums-${version}.md" || { echo "missing docs/checksums-${version}.md"; exit 2; }
          echo "MOJOBPF_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: provision the pinned build backend
        # The wheel's WHEEL/METADATA rows name the setuptools
        # version that built them, so the backend is pinned by
        # hash to the one the checksums record was built with.
        run: |
          set -euo pipefail
          python3 -m venv /tmp/build-venv
          printf '%s\n' 'setuptools==80.10.2 --hash=sha256:95b30ddfb717250edb492926c92b5221f7ef3fbcc2b07579bcd4a27da21d0173' > /tmp/build-requirements.txt
          /tmp/build-venv/bin/python -m pip install --require-hashes --no-deps -r /tmp/build-requirements.txt
      - name: build wheel and sdist
        run: |
          set -euo pipefail
          /tmp/build-venv/bin/python -m pip wheel . --no-deps --no-build-isolation -w dist
          /tmp/build-venv/bin/python setup.py -q sdist
          ls dist/
      - name: verify the sdist rebuilds the wheel
        # The sdist must be self-contained: a wheel built from the
        # unpacked sdist has byte-identical extracted contents to
        # the wheel built from the tag tree, or this step fails.
        run: |
          set -euo pipefail
          rm -rf /tmp/sdistcheck && mkdir -p /tmp/sdistcheck
          tar -xzf dist/mojobpf-*.tar.gz -C /tmp/sdistcheck
          sdist_root=$(echo /tmp/sdistcheck/mojobpf-*)
          test -d "$sdist_root"
          (cd "$sdist_root" && /tmp/build-venv/bin/python -m pip wheel . --no-deps --no-build-isolation -w /tmp/sdistcheck/dist)
          rm -rf /tmp/sdistwheel && mkdir -p /tmp/sdistwheel
          python3 -m zipfile -e /tmp/sdistcheck/dist/mojobpf-*.whl /tmp/sdistwheel
          python3 - > /tmp/sdist-contents.txt <<'PYEOF'
          import hashlib
          import os
          rows = []
          for root, _, files in os.walk('/tmp/sdistwheel'):
              for name in files:
                  path = os.path.join(root, name)
                  digest = hashlib.sha256()
                  with open(path, 'rb') as handle:
                      for chunk in iter(lambda: handle.read(65536), b''):
                          digest.update(chunk)
                  rows.append('%s  %s' % (
                      digest.hexdigest(),
                      os.path.relpath(path, '/tmp/sdistwheel'),
                  ))
          print('\n'.join(sorted(
              rows, key=lambda row: row.split(None, 1)[1])))
          PYEOF
          rm -rf /tmp/directwheel && mkdir -p /tmp/directwheel
          python3 -m zipfile -e dist/mojobpf-*.whl /tmp/directwheel
          python3 - > /tmp/direct-contents.txt <<'PYEOF'
          import hashlib
          import os
          rows = []
          for root, _, files in os.walk('/tmp/directwheel'):
              for name in files:
                  path = os.path.join(root, name)
                  digest = hashlib.sha256()
                  with open(path, 'rb') as handle:
                      for chunk in iter(lambda: handle.read(65536), b''):
                          digest.update(chunk)
                  rows.append('%s  %s' % (
                      digest.hexdigest(),
                      os.path.relpath(path, '/tmp/directwheel'),
                  ))
          print('\n'.join(sorted(
              rows, key=lambda row: row.split(None, 1)[1])))
          PYEOF
          diff -u /tmp/direct-contents.txt /tmp/sdist-contents.txt
      - name: verify wheel contents against the checksums record
        # Container bytes vary per build (zip metadata); the
        # extracted contents must match the record exactly.
        run: |
          set -euo pipefail
          rm -rf /tmp/wheelcheck && mkdir -p /tmp/wheelcheck
          python3 -m zipfile -e dist/mojobpf-*.whl /tmp/wheelcheck
          python3 - > /tmp/contents.txt <<'PYEOF'
          import hashlib
          import os
          rows = []
          for root, _, files in os.walk('/tmp/wheelcheck'):
              for name in files:
                  path = os.path.join(root, name)
                  digest = hashlib.sha256()
                  with open(path, 'rb') as handle:
                      for chunk in iter(lambda: handle.read(65536), b''):
                          digest.update(chunk)
                  rows.append('%s  %s' % (
                      digest.hexdigest(),
                      os.path.relpath(path, '/tmp/wheelcheck'),
                  ))
          print('\n'.join(sorted(
              rows, key=lambda row: row.split(None, 1)[1])))
          PYEOF
          python3 - > /tmp/expected.txt <<'PYEOF'
          import re
          text = open('docs/checksums-%s.md' % __import__('os').environ['MOJOBPF_RELEASE_VERSION']).read()
          rows = []
          for block in re.findall(r'```text\n(.*?)```', text, re.S):
              rows += [line for line in block.splitlines()
                       if re.match(r'^[0-9a-f]{64}  ', line)]
          assert rows, 'no checksum rows in the record'
          print('\n'.join(sorted(
              rows, key=lambda row: row.split(None, 1)[1])))
          PYEOF
          diff -u /tmp/expected.txt /tmp/contents.txt
      - name: write SHA256SUMS
        # Release-asset manifest: container hashes of every
        # attached artifact plus the versioned records. The SBOM
        # glob matches nothing until the SBOM step lands; the
        # wheel+sdist lines are required.
        run: |
          set -euo pipefail
          rm -f dist/SHA256SUMS
          (cd dist && sha256sum mojobpf-*.whl mojobpf-*.tar.gz > SHA256SUMS)
          for sbom in dist/*.cyclonedx.json; do
            [ -e "$sbom" ] || continue
            (cd dist && sha256sum "$(basename "$sbom")" >> SHA256SUMS)
          done
          sha256sum "docs/checksums-${MOJOBPF_RELEASE_VERSION}.md" "docs/evidence-${MOJOBPF_RELEASE_VERSION}.md" >> dist/SHA256SUMS
          cat dist/SHA256SUMS
      - name: attest the artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: open the draft release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          prerelease: false
          files: |
            dist/*
            docs/checksums-${{ env.MOJOBPF_RELEASE_VERSION }}.md
            docs/evidence-${{ env.MOJOBPF_RELEASE_VERSION }}.md
          body_path: docs/release-notes-${{ env.MOJOBPF_RELEASE_VERSION }}.md
