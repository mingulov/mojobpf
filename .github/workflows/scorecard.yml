# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# MojoBPF OpenSSF Scorecard scan.
#
# Runs the Scorecard analysis on every push to main and every pull
# request, and uploads the SARIF report to this repository's own
# code scanning. Results are NOT published externally
# (publish_results: false): publishing to the Scorecard API/badge
# needs its own owner call. Trust posture matches the other
# workflows: every Action pinned to a full commit SHA with the
# resolved tag in the trailing comment.
name: scorecard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - name: Upload to code-scanning
        if: always()
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
