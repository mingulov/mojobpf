# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# External-consumer reservation manifest. This file is owned by the
# consumer: it names only the consumer's own source and the public
# target profile, map shape, and license declarations.
schema_version = 1

[project]
name = "reserve-emitter"

[target]
profile = "linux-bpfel-v3-reserve"
core = false

[artifact]
name = "reserve_emitter"
source_license = "Apache-2.0 WITH LLVM-exception"
kernel_license = "Apache-2.0 WITH LLVM-exception"

[[programs]]
source = "emitter.mojo"
entry = "trace_entry"
program_type = "tracepoint"
section = "tracepoint/syscalls/sys_enter_getpid"

[[maps]]
name = "mojobpf_map0"
map_type = "array"
key_type = "u32"
value_type = "u64"
max_entries = 4

[[maps]]
name = "mojobpf_map1"
map_type = "ringbuf"
key_type = "none"
value_type = "none"
max_entries = 131072
