# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
schema_version = 1

[project]
name = "hash-counter"

[target]
profile = "linux-bpfel-v3-hash"
core = false

[artifact]
name = "hash_counter"
source_license = "Apache-2.0 WITH LLVM-exception"
kernel_license = "Apache-2.0 WITH LLVM-exception"

[[programs]]
source = "counter.mojo"
entry = "xdp_entry"
program_type = "xdp"
section = "xdp"

# The counter shape: key 0 holds the invocation count as a u64.
# Userspace initializes it before the first run; the kernel
# program only ever increments it on a lookup hit.
[[maps]]
name = "mojobpf_map0"
map_type = "hash"
key_type = "u32"
value_type = "u64"
max_entries = 1
